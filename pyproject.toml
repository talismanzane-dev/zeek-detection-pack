[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zeek-detection-pack"
dynamic = ["version"]
description = "Batch detection analytics over Zeek logs: C2 beaconing, DNS tunneling, DGA, and lateral movement, with ATT&CK mapping, a labeled test harness, and Sigma/Suricata export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zane Simwanza", email = "zanesimw@gmail.com" }]
requires-python = ">=3.11"
keywords = ["zeek", "detection-engineering", "threat-detection", "sigma", "suricata", "mitre-attack", "soc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.1",
    "tldextract>=5.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.0",
    "types-pyyaml>=6.0",
]
export-validate = [
    "sigma-cli>=1.0",
]

[project.urls]
Homepage = "https://github.com/talismanzane-dev/zeek-detection-pack"
Issues = "https://github.com/talismanzane-dev/zeek-detection-pack/issues"

[project.scripts]
zdp = "zdp.cli:main"

# Analyzers are discovered through this entry-point group. Third-party packages
# can register additional analyzers by declaring entries in the same group.
[project.entry-points."zdp.analyzers"]
c2_beaconing = "zdp.analyzers.c2_beaconing:C2BeaconingAnalyzer"
dns_tunneling = "zdp.analyzers.dns_tunneling:DNSTunnelingAnalyzer"
dga = "zdp.analyzers.dga:DGAAnalyzer"

[tool.hatch.version]
path = "zdp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zdp"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.0",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures", "rules"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PTH", "PL", "N"]
ignore = [
    "PLR0911",  # many returns are clearer than nested conditionals in gate checks
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",  # thresholds are named in config; literal comparisons in tests are fine
    "PLR0917",  # keyword-heavy signatures are clearer than parameter objects here
    "PLC0415",  # deliberate lazy imports break registry/pipeline import cycles
    "RUF001",   # unicode in docstrings (≥, ±) is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "S101"]
"tools/**" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["zdp"]

[[tool.mypy.overrides]]
module = ["tldextract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "system: end-to-end runs of the harness over the bundled fixtures",
]

[tool.coverage.run]
source = ["zdp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
