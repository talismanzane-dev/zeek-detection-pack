# zeek-detection-pack default configuration.
#
# Detector sections mirror each analyzer's DEFAULTS exactly (enforced by
# tests/unit/test_config.py), so this file is the authoritative, documented
# set of thresholds. Override per site with an overlay file rather than
# editing defaults; see docs/tuning.md for the calibration procedure.
#
# Every detector scores confidence = Σ wᵢ·cᵢ (weights sum to 1) and emits only
# when confidence >= min_confidence AND all hard gates pass.
version: 1

runner:
  # Inputs larger than this (bytes on disk) are processed in time-bounded
  # chunks of chunk_seconds; results are identical to a single full read.
  chunk_threshold_bytes: 536870912
  chunk_seconds: 86400

reader:
  # Reverse-lookup zones (in-addr.arpa, ip6.arpa) are dropped at read time:
  # 63+ label IPv6 PTR names otherwise look like tunnels (spec §7.2).
  drop_arpa: true

policy:
  networks_file: allowlists/networks.yaml
  domains_file: allowlists/domains.txt
  schedules_file: schedules.yaml
  # Treat PSL private-section suffixes (s3.amazonaws.com, cloudfront.net,
  # duckdns.org …) as public suffixes when computing registered domains.
  include_psl_private_domains: true
  # Internal DNS zones excluded from DGA burst counting (search-suffix storms).
  internal_zones: []

detectors:
  c2_beaconing:
    enabled: true
    window_seconds: 3600
    window_overlap: 0.5          # 50 % overlap so beacons straddling a boundary are not halved
    min_confidence: 0.6
    min_connections: 8           # hard gate
    min_median_interval: 10.0    # hard gate: below → bulk/keep-alive traffic
    max_median_interval: 3600.0  # hard gate: above → too sparse for one window
    suppress_services: [ntp]
    allowlist_categories: [ntp, updates, saas, monitoring]
    keepalive:                   # Zeek-split long-lived sessions (spec §7.1)
      oth_fraction: 0.5
      max_gap_seconds: 1.0
    weights: {interval: 0.45, bytes: 0.30, count: 0.15, resp_volume: 0.10}
    interval_cv: {one_at: 0.12, zero_at: 0.5}   # scored on min(CV, 1.4826·MAD/median)
    bytes_cv: {one_at: 0.1, zero_at: 0.6}
    count_saturation: 48         # ≈ one hour of 75 s beacons
    resp_small_bytes: 2048
    resp_small_score: 1.0
    resp_large_score: 0.3
    export:
      suricata_ports: [80, 443, 8080, 8443]

  dns_tunneling:
    enabled: true
    window_seconds: 3600
    window_overlap: 0.0
    min_confidence: 0.6
    min_queries: 30                  # hard gate, per (src, registered domain) per window
    min_mean_subdomain_length: 20    # hard gate (cheap pre-filter)
    weights: {entropy: 0.30, query_length: 0.25, txt_null_ratio: 0.15, unique_subdomain_ratio: 0.15, volume: 0.15}
    entropy: {zero_at: 3.0, one_at: 4.0}             # bits/char of subdomain labels
    query_length: {zero_at: 40, one_at: 80}          # full query length
    txt_null_ratio: {zero_at: 0.05, one_at: 0.4}
    unique_subdomain_ratio: {zero_at: 0.5, one_at: 0.95}
    volume: {zero_at: 30, one_at: 300}
    txt_null_types: [TXT, "NULL"]   # quoted: bare NULL is YAML null
    half_weight_types: [CNAME]
    half_weight: 0.5
    exfil_component_threshold: 0.9   # secondary T1048.003 when uniqueness AND volume components reach this
    exclude_qtypes: [SRV]
    exclude_underscore_labels: true  # _ldap._tcp… service discovery
    qps_bucket_seconds: 60
    sample_queries: 3
    sample_max_length: 120

  dga:
    enabled: true
    window_seconds: 3600
    window_overlap: 0.0
    min_confidence: 0.6
    burst_window_seconds: 300
    nx_burst_min: 10                 # unique NXDOMAIN registered domains in burst_window_seconds
    burst_saturation_span: 40        # c_burst = min((n - nx_burst_min) / span, 1)
    nxdomain_rcodes: [NXDOMAIN]
    min_sld_length: 6
    top_k: 20
    min_lexical: 0.4                 # hard gate: a burst alone never fires
    weights: {burst: 0.5, lexical: 0.5}
    lexical_weights: {entropy: 0.35, bigram: 0.35, digit_ratio: 0.15, consonant_run: 0.15}
    entropy: {zero_at: 2.8, one_at: 3.8}
    # "table": anchors come from the calibration stored with the bundled
    # bigram table (zdp/data/bigram_freq.json) — never hard-coded here.
    bigram: {zero_at: table, one_at: table}
    digit_ratio: {zero_at: 0.0, one_at: 0.3}
    consonant_run: {zero_at: 2, one_at: 5}
    max_evidence_domains: 20
