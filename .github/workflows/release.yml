name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Tag matches package version
        run: |
          version="$(python -c 'import zdp; print(zdp.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "::error::tag $GITHUB_REF_NAME does not match zdp.__version__ $version"; exit 1; }

      - name: Tests, harness and gates
        run: |
          pytest tests -q
          mkdir -p dist
          python -m zdp.harness --fixtures fixtures --out dist/metrics.json --reports dist/reports
          python tools/check_gates.py dist/metrics.json quality_gates.yaml

      - name: Export rules
        run: |
          zdp export --format all --out dist/rules
          tar -czf "dist/zdp-rules-${GITHUB_REF_NAME}.tar.gz" -C dist rules

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: SBOM for the published image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `${{ env.IMAGE }}:${{ steps.meta.outputs.version }}`

            Attached `metrics.json` is the harness output for the bundled **synthetic fixture
            suite** — a logic regression check, not a performance benchmark. Benchmark results
            (e.g. CTU-13) are published only from a harness run on that dataset; see
            docs/evaluation.md.
          files: |
            dist/metrics.json
            dist/zdp-rules-${{ github.ref_name }}.tar.gz
            dist/sbom.spdx.json
